[project]
name = "fpl-mentat"
authors = [{name = "Vikram Magal", email = "vikrammagal@outlook.com"}]
version = "0.2.0"
description = "Component-decomposition and simulation models for Fantasy Premier League"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "dbt-core>=1.11.7",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.1",
    "lightgbm>=4.6.0",
    "numpy>=2.0",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "seaborn>=0.13.2",
]
