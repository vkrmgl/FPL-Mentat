version: 2

sources:
  - name: raw_layer
    database: fpl-mentat
    schema: main
    description: >
      Append-only raw layer. Every table carries `season`, `ingested_at` and
      `ingest_run_id`; nothing is ever updated in place. Staging picks the view
      it needs with window functions, which is what makes point-in-time player
      attributes possible at all.

      Three lineages land here, kept separate on purpose:
        * `raw_*`         - the live FPL API (2026-27 onward)
        * `raw_*`         - 2025-26, recovered from archived response bodies
        * `raw_vaastav_*` - 2016-17..2025-26 historical backfill
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 168, period: hour}
    loaded_at_field: ingested_at

    tables:
      # -- core API entities ------------------------------------------------
      - name: raw_players
        description: >
          One row per player per ingest snapshot, from /bootstrap-static/
          `elements`. Deliberately not deduplicated: the run-to-run differences
          are the only record of in-season price, availability, news and
          set-piece-order changes.
        columns:
          - name: id
            description: FPL element id. Unique within a season, reused across seasons.
          - name: element_type
            description: Position - 1 GKP, 2 DEF, 3 MID, 4 FWD.
          - name: now_cost
            description: Price in tenths of a million at snapshot time.
          - name: snapshot_at
            description: >
              Archive snapshot timestamp for recovered 2025-26 rows. NULL for
              live-ingested rows, where `ingested_at` serves the same purpose.

      - name: raw_teams
        description: One row per team per snapshot, with FPL's strength ratings.
      - name: raw_events
        description: One row per gameweek per snapshot - deadlines, averages, chip plays.
      - name: raw_fixtures
        description: >
          One row per fixture per snapshot. `event` is the gameweek and is NULL
          for fixtures not yet assigned to one.
      - name: raw_fixture_stats
        description: >
          Per-fixture event attribution unnested from `fixtures[].stats` -
          one row per fixture, identifier, side and player.

      # -- the decomposition source ----------------------------------------
      - name: raw_player_fixture_points
        description: >
          One row per player, fixture and scoring identifier, unnested from the
          `explain` block of /event/{gw}/live/.

          This is the component-level target for the decomposition models and
          the only per-fixture source for 2025-26 - the FPL API serves the
          current season only, so it was recovered from archived response
          bodies. Components reconcile exactly against `total_points`.
        columns:
          - name: identifier
            description: Scoring event name; joins to `scoring_rules.identifier`.
          - name: value
            description: Raw event count for this fixture (minutes, goals, saves...).
          - name: points
            description: Points awarded for this event in this fixture.

      - name: raw_player_gameweek
        description: >
          Player stats at gameweek grain from /event/{gw}/live/ `stats`. FPL
          collapses double gameweeks into one row here, which is why
          `raw_player_fixture_points` exists.

      # -- reference --------------------------------------------------------
      - name: raw_element_types
        description: >
          Position metadata including `squad_select`, `squad_min_play` and
          `squad_max_play` - the squad constraints the optimizer needs.
      - name: raw_chips
        description: >
          Chip definitions with `start_event`/`stop_event`. The season splits
          into two halves, each with its own wildcard, free hit, bench boost
          and triple captain.
      - name: raw_phases
        description: Monthly phases used for FPL's own leaderboards.
      - name: raw_game_settings
        description: >
          Single wide row of game rules - budget, squad size, team limit,
          transfer cap and `max_extra_free_transfers`.
      - name: raw_element_stats
        description: Names and labels of the stats FPL tracks.

      # -- manager and league ----------------------------------------------
      - name: raw_entry
        description: Manager profile, one row per entry per ingest.
      - name: raw_entry_league
        description: Leagues an entry belongs to.
      - name: raw_entry_gameweek
        description: An entry's per-gameweek points, rank, bank and transfers.
      - name: raw_entry_past_season
        description: An entry's finishing points and rank in prior seasons.
      - name: raw_entry_chip
        description: Chips an entry has played and when.
      - name: raw_entry_transfer
        description: An entry's full transfer log.
      - name: raw_entry_pick
        description: >
          An entry's squad for a gameweek, with captain, vice, bench order and
          active chip. Only fetchable after that gameweek's deadline and cannot
          be backfilled.
      - name: raw_league
        description: Classic league metadata.
      - name: raw_league_standing
        description: >
          League membership. `membership` distinguishes scored standings from
          pre-season joiners, who appear under a different key in the API.

      # -- historical backfill ---------------------------------------------
      - name: raw_vaastav_player_gameweek
        description: >
          Historical player rows from vaastav/Fantasy-Premier-League, 2016-17
          onward, already merged with Understat xG. Per-fixture: `fixture`
          identifies the match, so double gameweeks are two rows.

          Complementary to the API lineage rather than a substitute. It carries
          per-gameweek `value` (price), `selected` (ownership), transfer flow
          and FPL's own `xP`, none of which the API exposes historically. It
          does not carry the `explain` component breakdown.
        columns:
          - name: element
            description: FPL element id for that season.
          - name: fixture
            description: FPL fixture id.
          - name: value
            description: Price in tenths of a million at that gameweek.
          - name: xP
            description: FPL's own expected points - a free public benchmark.
      - name: raw_vaastav_players
        description: End-of-season player attributes per historical season.
      - name: raw_vaastav_teams
        description: Team reference per historical season.
      - name: raw_vaastav_fixtures
        description: Fixture reference per historical season.

      # -- audit -------------------------------------------------------------
      - name: raw_log
        description: >
          Per-request audit log holding full response bodies. This archive is
          what made the 2025-26 recovery possible after the API rolled over.
      - name: ingest_run
        description: One row per ingestion run, with status and arguments.
