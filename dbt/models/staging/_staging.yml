version: 2

models:
  - name: stg_player_fixture
    description: >
      One row per player per match. Grain: season x player_id x fixture_id.

      The core observation table. Double gameweeks are two rows rather than one
      collapsed row - the old pipeline joined gameweek-grain player stats to
      fixture-grain rows and fanned out, duplicating 327 player-gameweeks and
      corrupting every rolling window downstream.

      Unions two lineages, tagged by `source`: vaastav for 2016-17..2025-26, the
      FPL API from 2026-27. vaastav wins where both cover a season because it
      runs to gameweek 38 while the recovered API archive stops at 35.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id, fixture_id]
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: gameweek
        description: >
          1-38 in a normal season. 2019-20 runs to 47 after the COVID
          suspension, so range checks must accommodate it.
        tests: [not_null]
      - name: minutes
        description: Minutes played in this fixture.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
                inclusive: true
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['api', 'vaastav']
      - name: total_points
        description: >
          FPL points for this fixture. On an API-sourced double gameweek this is
          apportioned by minutes share, so it can be fractional; the per-fixture
          component points in stg_player_fixture_points remain exact.

  - name: stg_player_fixture_points
    description: >
      Long-form component points. Grain: season x player_id x fixture_id x
      identifier. The decomposition training target, and the source of the
      reconciliation check in tests/assert_component_points_reconcile.sql.
      API lineage only, so 2025-26 onward.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id, fixture_id, identifier]
    columns:
      - name: identifier
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_scoring_rules')
                field: identifier
      - name: points
        tests: [not_null]

  - name: stg_player_snapshot
    description: >
      Point-in-time player attributes with validity ranges. Grain: season x
      player_id x valid_from.

      Replaces the old `stg_players`, which collapsed to current state and so
      rewrote a transferred player's team across all of history. That is what
      the `player_team_corrections` seed exists to patch; this model retires it.

      2025-26 snapshots span 16 Apr - 8 May only. Point-in-time attributes for
      earlier gameweeks in that season do not exist in any source.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id, valid_from]
    columns:
      - name: player_id
        tests: [not_null]
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: price
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3.5
                max_value: 20.0
                inclusive: true

  - name: stg_fixtures
    description: >
      One row per match. Grain: season x fixture_id. API lineage covers 2025-26
      and 2026-27; vaastav covers 2018-19..2025-26. 2016-17 and 2017-18 have
      player rows but no fixture reference, so team-level models start at
      2018-19.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, fixture_id]
    columns:
      - name: gameweek
        tests: [not_null]
      - name: home_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_id
      - name: away_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_id

  - name: stg_teams
    description: >
      Grain: season x team_id. Team ids are reassigned alphabetically each
      season, so promoted clubs inherit relegated clubs' ids - every team join
      must carry the season.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, team_id]
    columns:
      - name: team_name
        tests: [not_null]

  - name: stg_deadlines
    description: >
      Grain: season x gameweek. The gameweek spine. `days_since_prev_gameweek`
      exposes schedule shape without any external source: ordinary weeks sit at
      7, congestion weeks drop to 3-4, and international breaks run 12 or more.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek]
    columns:
      - name: deadline_time
        tests: [not_null]

  - name: stg_scoring_rules
    description: >
      Grain: season x identifier x position x min_value. Validated seed - see
      seeds/_seeds.yml. Scoring is applied from here, never learned.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, identifier, position, min_value]

  - name: stg_squad_rules
    description: >
      Grain: season x position. Squad constraints for the optimizer, read from
      the API rather than hardcoded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, position]
    columns:
      - name: squad_count
        tests: [not_null]

  - name: stg_chips
    description: >
      Grain: season x chip_name x season_half. Each half of the season carries
      its own wildcard, free hit, bench boost and triple captain.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, chip_name, season_half]
